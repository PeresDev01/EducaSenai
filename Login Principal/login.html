<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaSENAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- Lado Esquerdo -->
        <div class="left-side">
            <div class="info">
              <img src="logoEducaSenai.png" alt="Logo EducaSENAI" class="logo" />
              <p>Aprenda, evolua e transforme o futuro com o SENAI.</p>
            </div>
          </div>
          

        <!-- Lado Direito -->
        <div class="right-side">
            <div class="login-section">
                <h2>Acesse sua Conta</h2>
                <form>
                    <input type="text" placeholder="Usuário" required>
                    <input type="password" placeholder="Senha" required>
                    <button type="submit" class="btn">Entrar</button>
                </form>
                <div class="cta-buttons">
                    <a href="/Cadastro/index.html" class="btn-secondary">Cadastrar-se</a>
                    <a href="/Login Professor/index.html" class="btn-secondary">Sou Professor</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
