<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaSenai</title>
    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <img src="img/logoEducaSenai.png" alt="Logo">
        </div>
        <div class="user-info">
            <a href="index.html" class="user-avatar-link">
                <img src="img/user-avatar.jpg" alt="Foto do usuário" class="user-avatar">
            </a>
            <div class="user-name">Edufinho Aqua</div>
            <div class="user-role">Aluno</div>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">
                    <img src="./img/casa.png" alt="Inicial">
                    Inicial
                </a></li>
                <li><a href="#">
                    <img src="./img/sair.png" alt="Sair">
                    Sair
                </a></li>
            </ul>
        </nav>
        <!-- Botão para alternar a visibilidade da sidebar -->
        <button class="toggle-menu" title="Contrair menu">
            &#9776;
        </button>
    </div>

    <!-- Botão para expandir a sidebar, visível apenas quando colapsada -->
    <button class="expand-sidebar" title="Abrir menu">
        &#9776;
    </button>

    <!-- Conteúdo principal -->
    <div class="main-content">
        <h1>Início</h1>
        <div class="grid">
            <a href="/Trilha de aprendizado IOT//index.html" class="card">
                <img src="./img/iotnovo.png" alt="IOT"> <span>IOT</span>
            </a>
            <a href="/Trilha de aprendizado SOP/index.html" class="card">
                <img src="./img/sistemasoperacionais.png" alt="Sistemas Operacionais"> <span>Sistemas Operacionais</span>
            </a>
            <a href="/Trilha de aprendizado LEVAN/index.html" class="card">
                <img src="./img/levantamento.png" alt="Levantamento de Requisitos"> <span>Levantamento de Requisitos</span>
            </a>
            <a href="/Trilha de aprendizado FRONT/index.html" class="card">
                <img src="./img/front.png" alt="Frontend"> <span>Frontend</span>
            </a>
            <a href="/Trilha de aprendizado BANCO/index.html" class="card">
                <img src="./img/banco.png" alt="Banco de Dados"> <span>Banco de Dados</span>
            </a>
            <a href="/Trilha de aprendizado BACK/index.html" class="card">
                <img src="./img/backnovo.png" alt="Backend"> <span>Backend</span>
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
